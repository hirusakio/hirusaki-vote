let selected=79;let selectedCell=null;const activeDiv=new Set([1,2]);const activeWeeks=new Set([1,2,3,4,5,6,7,8]);const activePoints=new Set([2,3,4]);const weekOf=id=>Math.floor((id-52)/6)+1;
const byId=id=>rooms.find(r=>r.id===id);const pointClass=p=>p===4?"p4":p===3?"p3":p===2?"p2":"empty";const fmt=x=>Math.round(x*100)+"%";
function filteredVotes(){return rooms.filter(r=>activeDiv.has(r.division)&&activeWeeks.has(weekOf(r.id))).flatMap(r=>r.votes.filter(v=>activePoints.has(v.points)).map(v=>({...v,room:r})));}
function renderStats(){const v=filteredVotes(),n=v.length;document.getElementById("sCount").textContent=n;if(!n){["s25","s50"].forEach(id=>document.getElementById(id).textContent="-");return;}document.getElementById("s25").textContent=fmt(v.filter(x=>x.rawRank/x.room.submissions<=.25).length/n);document.getElementById("s50").textContent=fmt(v.filter(x=>x.rawRank/x.room.submissions<=.5).length/n);}
function renderHeat(){const h=document.getElementById("heat");h.innerHTML="";["回","部"].forEach(t=>{let c=document.createElement("div");c.className="cell head";c.textContent=t;h.appendChild(c)});for(let i=1;i<=40;i++){let c=document.createElement("div");c.className="cell head";c.textContent=[1,5,10,15,20,25,30,35,40].includes(i)?i:"";h.appendChild(c)}
for(const r of rooms){const rowOn=activeDiv.has(r.division)&&activeWeeks.has(weekOf(r.id)),map={};r.votes.forEach(v=>map[v.displayRank]=v);const selfRank=r.self?r.self.displayRank:null;let a=document.createElement("div");a.className="cell lab "+(r.division===1?"div1 ":"")+(r.id===selected&&!selectedCell?"selected ":"")+(!rowOn?"muted-row":"");a.textContent=r.id;a.onclick=()=>select(r.id);h.appendChild(a);let b=document.createElement("div");b.className="cell lab "+(r.division===1?"div1 ":"")+(r.id===selected&&!selectedCell?"selected ":"")+(!rowOn?"muted-row":"");b.textContent=r.division+"部";b.onclick=()=>select(r.id);h.appendChild(b);for(let rank=1;rank<=40;rank++){let c=document.createElement("div"),v=map[rank],isSelf=rank===selfRank,exists=rank<=r.submissions;c.className="cell "+(exists?"answer-cell ":"")+(rank>r.submissions?"void":isSelf?"self":v?pointClass(v.points):"empty")+((selectedCell&&selectedCell.roomId===r.id&&selectedCell.displayRank===rank)?" selected":"")+((!rowOn||(v&&!activePoints.has(v.points)))?" muted-cell":"");if(exists){const ans=(r.answers||[]).find(x=>x.displayRank===rank);c.title=ans?(ans.isSelf?"自分の回答：":"")+ans.author+"「"+ans.answer+"」":"";c.onclick=()=>selectCell(r.id,rank)}else{c.onclick=()=>select(r.id)}h.appendChild(c)}}}
function renderDetail(){const r=byId(selected),pts=r.votes.reduce((s,v)=>s+v.points,0),listTitle=document.getElementById("dListTitle");let d=document.getElementById("dDiv");d.textContent=r.division+"部";d.className="pill "+(r.division===1?"div1":"");document.getElementById("dPrompt").textContent=r.prompt;let img=document.getElementById("dImg");if(r.imageUrl){img.src=r.imageUrl;img.style.display="block"}else{img.style.display="none";img.removeAttribute("src")}document.getElementById("dSrc").href=r.source;let box=document.getElementById("dVotes");box.innerHTML="";
if(selectedCell&&selectedCell.roomId===r.id){const a=(r.answers||[]).find(x=>x.displayRank===selectedCell.displayRank);if(a){document.getElementById("dTitle").textContent=`第${r.id}回 ${a.displayRank}位`;document.getElementById("dCount").textContent=a.rawRank===a.displayRank?"":`実順位 ${a.rawRank}位（同率）`;document.getElementById("dSub").textContent=`${r.submissions}回答`;listTitle.textContent="選択した回答";let x=document.createElement("div");x.className="vote";const vote=a.votePoints?`<span class="badge ${pointClass(a.votePoints)}">${a.votePoints}点</span>`:"";const self=a.isSelf?`<span class="pill" style="background:var(--self)">自分の回答</span>`:"";x.innerHTML=`<div class="vote-top">${vote}<span class="rank">${a.displayRank}位</span><span class="author">${esc(a.author)}</span>${self}</div><div class="answer">${formatAnswer(r.prompt,a.answer)}</div>`;box.appendChild(x);return}}
document.getElementById("dTitle").textContent=`第${r.id}回`;document.getElementById("dCount").textContent=`投票 ${r.votes.length}件 / ${pts}点`;document.getElementById("dSub").textContent=`${r.submissions}回答`;listTitle.textContent="投票先";if(!r.votes.length){let e=document.createElement("div");e.className="box";e.textContent="投票先なし";box.appendChild(e)}for(const v of [...r.votes].sort((a,b)=>a.displayRank-b.displayRank||a.rawRank-b.rawRank||b.points-a.points)){let x=document.createElement("div");x.className="vote";x.innerHTML=`<div class="vote-top"><span class="badge ${pointClass(v.points)}">${v.points}点</span><span class="rank">${v.displayRank}位</span><span class="author">${esc(v.author)}</span><span class="pct">上位${fmt(v.rawRank/r.submissions)}</span></div><div class="answer">${formatAnswer(r.prompt,v.answer)}</div>`;box.appendChild(x)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function cleanAnswer(s){return String(s).replace(/ /g,"")}
function formatAnswer(prompt,answer){const a=cleanAnswer(answer),p=cleanAnswer(prompt);if(!p.includes("○○○"))return esc(a);const parts=p.split("○○○"),pre=parts[0],suf=parts.slice(1).join("○○○");if(a.startsWith(pre)&&(!suf||a.endsWith(suf))){const end=suf?a.length-suf.length:a.length;return esc(pre)+"<strong>"+esc(a.slice(pre.length,end))+"</strong>"+esc(suf)}if(a.startsWith(pre))return esc(pre)+"<strong>"+esc(a.slice(pre.length))+"</strong>";if(suf&&a.endsWith(suf))return "<strong>"+esc(a.slice(0,a.length-suf.length))+"</strong>"+esc(suf);return "<strong>"+esc(a)+"</strong>"}
function select(id){selected=id;selectedCell=null;renderHeat();renderDetail()}function selectCell(id,displayRank){selected=id;selectedCell={roomId:id,displayRank};renderHeat();renderDetail()}function render(){renderStats();renderHeat();renderDetail()}
function bindFilter(selector,set,allValues,dataKey){const buttons=[...document.querySelectorAll(selector)];buttons.forEach(b=>b.onclick=()=>{const v=+b.dataset[dataKey];if(set.size===allValues.length){set.clear();set.add(v)}else if(set.has(v)&&set.size===1){set.clear();allValues.forEach(x=>set.add(x))}else if(set.has(v)){set.delete(v)}else{set.add(v)}buttons.forEach(x=>x.classList.toggle("active",set.has(+x.dataset[dataKey])));render()})}
