let selected=79;const activeDiv=new Set([1,2]);const activePoints=new Set([2,3,4]);
const byId=id=>rooms.find(r=>r.id===id);const pointClass=p=>p===4?"p4":p===3?"p3":p===2?"p2":"empty";const fmt=x=>Math.round(x*100)+"%";
function filteredVotes(){return rooms.filter(r=>activeDiv.has(r.division)).flatMap(r=>r.votes.filter(v=>activePoints.has(v.points)).map(v=>({...v,room:r})));}
function renderStats(){const v=filteredVotes(),n=v.length;document.getElementById("sCount").textContent=n;if(!n){["s25","s50"].forEach(id=>document.getElementById(id).textContent="-");return;}document.getElementById("s25").textContent=fmt(v.filter(x=>x.rawRank/x.room.submissions<=.25).length/n);document.getElementById("s50").textContent=fmt(v.filter(x=>x.rawRank/x.room.submissions<=.5).length/n);}
function renderHeat(){const h=document.getElementById("heat");h.innerHTML="";["回","部"].forEach(t=>{let c=document.createElement("div");c.className="cell head";c.textContent=t;h.appendChild(c)});for(let i=1;i<=40;i++){let c=document.createElement("div");c.className="cell head";c.textContent=[1,5,10,15,20,25,30,35,40].includes(i)?i:"";h.appendChild(c)}
for(const r of rooms){const rowOn=activeDiv.has(r.division),map={};r.votes.forEach(v=>map[v.displayRank]=v);let a=document.createElement("div");a.className="cell lab "+(r.division===1?"div1 ":"")+(r.id===selected?"selected ":"")+(!rowOn?"muted-row":"");a.textContent=r.id;a.onclick=()=>select(r.id);h.appendChild(a);let b=document.createElement("div");b.className="cell lab "+(r.division===1?"div1 ":"")+(r.id===selected?"selected ":"")+(!rowOn?"muted-row":"");b.textContent=r.division+"部";b.onclick=()=>select(r.id);h.appendChild(b);for(let rank=1;rank<=40;rank++){let c=document.createElement("div"),v=map[rank];c.className="cell "+(rank>r.submissions?"void":v?pointClass(v.points):"empty")+(r.id===selected?" selected":"")+((!rowOn||(v&&!activePoints.has(v.points)))?" muted-cell":"");c.onclick=()=>select(r.id);h.appendChild(c)}}}
function renderDetail(){const r=byId(selected),pts=r.votes.reduce((s,v)=>s+v.points,0);document.getElementById("dTitle").textContent=`第${r.id}回`;let d=document.getElementById("dDiv");d.textContent=r.division+"部";d.className="pill "+(r.division===1?"div1":"");document.getElementById("dCount").textContent=`投票 ${r.votes.length}件 / ${pts}点`;document.getElementById("dSub").textContent=`${r.submissions}回答`;document.getElementById("dPrompt").textContent=r.prompt;let img=document.getElementById("dImg");if(r.imageUrl){img.src=r.imageUrl;img.style.display="block"}else{img.style.display="none";img.removeAttribute("src")}document.getElementById("dSrc").href=r.source;let box=document.getElementById("dVotes");box.innerHTML="";if(!r.votes.length){let e=document.createElement("div");e.className="box";e.textContent="投票先なし";box.appendChild(e)}for(const v of [...r.votes].sort((a,b)=>a.displayRank-b.displayRank||a.rawRank-b.rawRank||b.points-a.points)){let x=document.createElement("div");x.className="vote";x.innerHTML=`<div class="vote-top"><span class="badge ${pointClass(v.points)}">${v.points}点</span><span class="rank">${v.displayRank}位</span><span class="author">${esc(v.author)}</span><span class="pct">上位${fmt(v.rawRank/r.submissions)}</span></div><div class="answer">${esc(v.answer)}</div>`;box.appendChild(x)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function select(id){selected=id;renderHeat();renderDetail()}function render(){renderStats();renderHeat();renderDetail()}
document.querySelectorAll("[data-div]").forEach(b=>b.onclick=()=>{const v=+b.dataset.div;if(activeDiv.has(v)&&activeDiv.size>1){activeDiv.delete(v);b.classList.remove("active")}else if(!activeDiv.has(v)){activeDiv.add(v);b.classList.add("active")}render()});
document.querySelectorAll("[data-point]").forEach(b=>b.onclick=()=>{const v=+b.dataset.point;if(activePoints.has(v)&&activePoints.size>1){activePoints.delete(v);b.classList.remove("active")}else if(!activePoints.has(v)){activePoints.add(v);b.classList.add("active")}render()});
document.getElementById("prev").onclick=()=>selected>52&&select(selected-1);document.getElementById("next").onclick=()=>selected<81&&select(selected+1);render();
