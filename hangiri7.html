<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第7回半喜利 1・2回戦 結果ヒートマップ</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--line:#dfe5ef;--ink:#182230;--muted:#667085;--pass:#cfe1ff;--out:#edf2f7;--self:#56c596;--void:#9aa4b2;--sel:#172b48}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",Meiryo,sans-serif;line-height:1.5}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}a{color:#245aa5;text-underline-offset:4px}.shell{max-width:1740px;margin:auto;padding:22px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.header{padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em}.title{font-size:25px;font-weight:900;margin:2px 0 4px}.sub{font-size:13px;color:var(--muted)}.header>a{font-size:13px;white-space:nowrap}.controls{padding:14px 18px;margin-bottom:14px}.filter-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filter-label{font-size:13px;color:var(--muted);font-weight:700}.filter-label:not(:first-child){margin-left:10px}.toggle-row{display:flex;gap:5px}.toggle{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:35px;padding:5px 11px;font-size:13px}.toggle.active{background:#eaf2ff;color:#244f88;border-color:#a6c0e8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px;padding-top:13px;border-top:1px solid #edf0f5}.stats div{display:flex;align-items:baseline;gap:10px}.stats span{font-size:12px;color:var(--muted)}.stats strong{font-size:21px}.main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;align-items:start}.heat-card{padding:15px 12px}.heat-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.heat-head h2{font-size:18px;margin:0}.heat-head span{font-size:12px;color:var(--muted)}.legend{display:flex;gap:10px 16px;flex-wrap:wrap;margin:12px 0 8px}.legend span{display:flex;align-items:center;gap:5px;font-size:12px}.legend i{width:13px;height:13px;border-radius:3px}.help,.note{font-size:12px;color:var(--muted);margin:8px 0}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.heat{display:grid;width:100%;border-left:1px solid var(--line);border-top:1px solid var(--line)}.cell{border:0;border-right:1px solid #d6dfeb;border-bottom:1px solid #d6dfeb;border-radius:0;height:32px;min-width:0;padding:0;display:flex;align-items:center;justify-content:center;position:relative}.cell.head{height:29px;background:#f8fafc;color:var(--muted);font-size:11px}.cell.label{background:#fff;font-size:12px;font-weight:800}.cell.answer:hover,.cell.label:hover{z-index:2;box-shadow:inset 0 0 0 2px #334155}.cell.selected{box-shadow:inset 0 0 0 2px var(--sel);z-index:3}.pass{background:var(--pass)}.out{background:var(--out)}.self{background:var(--self)}.void{background:var(--void)}.detail{padding:18px;position:sticky;top:12px;scroll-margin-top:10px}.detail-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.detail h2{font-size:20px;margin:0}.meta{font-size:12px;color:var(--muted);margin:4px 0 14px}.section-label{font-size:12px;color:var(--muted);font-weight:800;margin:15px 0 6px}.prompt{background:#f8fafc;border:1px solid #e6ebf3;border-radius:10px;padding:12px;line-height:1.75;overflow-wrap:anywhere}.prompt img{display:block;max-width:100%;max-height:250px;object-fit:contain;margin:8px auto 0;border-radius:7px}.rank-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rank{font-size:20px;font-weight:900}.score{font-size:13px;color:var(--muted)}.badge{font-size:12px;font-weight:800;border-radius:6px;padding:3px 7px}.badge.pass{color:#244f88}.badge.out{color:#526070}.badge.self{color:#174936}.actual{font-size:12px;color:var(--muted);margin-top:3px}.answer{font-size:17px;line-height:1.8;margin:9px 0;white-space:pre-wrap;overflow-wrap:anywhere}.answer strong{font-weight:900}.author{font-size:12px;color:var(--muted)}.breakdown{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.point{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:#fff}.source{font-size:13px;display:inline-block;margin-top:17px}.group-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}.mini{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;text-align:left;width:100%}.mini:hover{background:#f8fafc}.mini-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.mini-answer{font-size:14px;margin-top:4px;overflow-wrap:anywhere}.empty{font-size:13px;color:var(--muted);padding:10px 0}
@media(max-width:1000px){.shell{padding:10px 7px}.main{grid-template-columns:1fr}.detail{position:static}.stats{grid-template-columns:repeat(2,1fr)}.scroll{overflow-x:auto}.header{padding:14px}.title{font-size:21px}.header>a{font-size:12px}.heat-card{padding:12px 6px}.heat{width:max-content}.cell.label,.heat>.cell.head:first-child{position:sticky;left:0;z-index:4;box-shadow:1px 0 0 #d6dfeb}.heat>.cell.head:first-child{z-index:5}.detail{padding:14px 12px}}
@media(max-width:520px){.header{gap:8px}.header>a{max-width:88px;white-space:normal;text-align:right}.controls{padding:11px 10px}.filter-line{display:grid;grid-template-columns:42px minmax(0,1fr);gap:7px}.filter-label,.filter-label:not(:first-child){grid-column:1;margin:0}.toggle-row{grid-column:2;flex-wrap:wrap}.toggle{padding:5px 9px}.stats{grid-template-columns:1fr;gap:4px}.stats div{justify-content:space-between}.legend{gap:7px 10px}.legend span{font-size:11px}.cell{height:32px}.answer{font-size:16px}}
</style>
</head>
<body>
<main class="shell">
<header class="card header">
<div><div class="eyebrow">第7回半喜利</div><div class="title">1・2回戦 結果ヒートマップ</div><div class="sub">各グループの掲載順を横並びで比較。セルを押すと回答・得点・得票率を表示します。</div></div>
<a href="https://oogiri-mi.com/hangiri7/match/" target="_blank" rel="noopener">元サイトを開く ↗</a>
</header>
<section class="card controls">
<div class="filter-line">
<span class="filter-label">回戦</span><div class="toggle-row"><button class="toggle active" data-round="1">1回戦</button><button class="toggle active" data-round="2">2回戦</button></div>
<span class="filter-label">お題</span><div class="toggle-row"><button class="toggle active" data-type="text">文章</button><button class="toggle active" data-type="picture">画像</button><button class="toggle active" data-type="blank">穴埋め</button></div>
</div>
<div class="stats"><div><span>グループ</span><strong id="group-count">—</strong></div><div><span>回答数</span><strong id="answer-count">—</strong></div><div><span>通過回答</span><strong id="pass-count">—</strong></div><div><span>自分の回答</span><strong id="self-count">—</strong></div></div>
</section>
<div class="main">
<section class="card heat-card">
<div class="heat-head"><h2>結果</h2><span id="visible-label"></span></div>
<div class="legend"><span><i class="pass"></i>通過</span><span><i class="out"></i>敗退</span><span><i class="self"></i>自分の回答</span><span><i class="void"></i>順位なし</span></div>
<p class="help">グループ名を押すとお題全体、マスを押すとその回答を表示します。スマホでは左右に動かせます。</p>
<div class="scroll"><div id="heat" class="heat"></div></div>
<p class="note">順位は元サイトの順位。同率の場合も掲載順ごとに別セルで表示します。個人の投票先は公開データに含まれないため色付けしていません。</p>
</section>
<aside id="detail" class="card detail"></aside>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const IMG_BASE="https://prd-oogiri-mi2-images.s3.ap-northeast-1.amazonaws.com/";
let DATA=null,selectedRounds=new Set([1,2]),selectedTypes=new Set(["text","picture","blank"]),selected=null;

function toggle(set,value,all){
 if(set.size===all.length){set.clear();set.add(value)}
 else if(set.has(value)&&set.size===1){set.clear();all.forEach(x=>set.add(x))}
 else if(set.has(value))set.delete(value);else set.add(value);
}
function allGroups(){
 if(!DATA)return[];
 return DATA.rounds.flatMap(r=>r.groups.map(g=>({...g,round:r.round,roundName:r.name})));
}
function visible(){return allGroups().filter(g=>selectedRounds.has(g.round)&&selectedTypes.has(g.promptType))}
function imageUrl(s){if(!s)return"";return /^https?:/.test(s)?s:IMG_BASE+s}
function fillHTML(g,a){
 if(g.promptType!=="blank")return esc(a.answer??"");
 let p=esc(g.prompt);
 (a.blanks||[]).forEach((v,i)=>{p=p.replaceAll("{{"+(i+1)+"}}","<strong>"+esc(v??"")+"</strong>")});
 return p;
}
function promptHTML(g){
 let h=esc(g.prompt).replace(/\n/g,"<br>");
 if(g.promptType==="blank")h=h.replace(/\{\{\d+\}\}/g,"○○○");
 if(g.imageUrl)h+=`<img src="${esc(imageUrl(g.imageUrl))}" alt="${esc(g.round+"回戦 "+g.group+"のお題画像")}">`;
 return h;
}
function bind(){
 document.querySelectorAll("[data-round]").forEach(b=>b.onclick=()=>{toggle(selectedRounds,+b.dataset.round,[1,2]);document.querySelectorAll("[data-round]").forEach(x=>x.classList.toggle("active",selectedRounds.has(+x.dataset.round)));selected=null;render()});
 document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{toggle(selectedTypes,b.dataset.type,["text","picture","blank"]);document.querySelectorAll("[data-type]").forEach(x=>x.classList.toggle("active",selectedTypes.has(x.dataset.type)));selected=null;render()});
}
function renderStats(list){
 $("group-count").textContent=list.length;
 $("answer-count").textContent=list.reduce((s,g)=>s+g.submissions,0);
 $("pass-count").textContent=list.reduce((s,g)=>s+g.answers.filter(a=>a.passed).length,0);
 $("self-count").textContent=list.reduce((s,g)=>s+g.answers.filter(a=>a.isSelf).length,0);
 $("visible-label").textContent=list.length+"グループ";
}
function renderHeat(list){
 const max=Math.max(1,...list.map(g=>g.submissions));
 const heat=$("heat");
 heat.style.gridTemplateColumns=`78px repeat(${max},minmax(22px,1fr))`;
 if(matchMedia("(max-width:1000px)").matches)heat.style.gridTemplateColumns=`68px repeat(${max},25px)`;
 let h='<div class="cell head">組</div>';
 for(let p=1;p<=max;p++)h+=`<div class="cell head">${p===1||p%5===0?p:""}</div>`;
 for(const g of list){
  const groupKey=g.round+"-"+g.id;
  h+=`<button class="cell label ${selected?.groupKey===groupKey&&!selected.position?"selected":""}" data-group="${esc(groupKey)}" title="${esc(g.round+"回戦 "+g.group)}">${g.round}-${esc(g.group.replace("グループ",""))}</button>`;
  for(let p=1;p<=max;p++){
   const a=g.answers[p-1];
   if(!a){h+='<div class="cell void"></div>';continue}
   const cls=a.isSelf?"self":a.passed?"pass":"out";
   const label=`${g.round}回戦 ${g.group} ${p}番目 実順位${a.rank}位 ${a.author} ${a.totalScore}点 得票率${Number(a.voteRate).toFixed(2)}`;
   h+=`<button class="cell answer ${cls} ${selected?.groupKey===groupKey&&selected.position===p?"selected":""}" data-group="${esc(groupKey)}" data-pos="${p}" title="${esc(label)}" aria-label="${esc(label)}"></button>`;
  }
 }
 heat.innerHTML=h;
 heat.querySelectorAll("[data-group]").forEach(b=>b.onclick=()=>{selected={groupKey:b.dataset.group,position:b.dataset.pos?+b.dataset.pos:null};renderHeat(list);renderDetail();if(matchMedia("(max-width:1000px)").matches)$("detail").scrollIntoView({behavior:"smooth",block:"start"})});
}
function findSelected(){
 if(!selected)return null;
 const [round,...rest]=selected.groupKey.split("-");
 const id=rest.join("-");
 const g=allGroups().find(x=>x.round===+round&&x.id===id);
 return g?{g,a:selected.position?g.answers[selected.position-1]:null}:null;
}
function rankHTML(a){
 return `<div class="rank-line"><span class="rank">${a.position}位</span><span class="score">${a.totalScore}点｜${Number(a.voteRate).toFixed(2)}</span><span class="badge ${a.passed?"pass":"out"}">${a.passed?"通過":"敗退"}</span>${a.isSelf?'<span class="badge self">自分の回答</span>':""}</div>${a.rank!==a.position?`<div class="actual">実順位 ${a.rank}位（同率）</div>`:""}`;
}
function renderDetail(){
 let x=findSelected();
 if(!x){const g=visible()[0];if(!g){$("detail").innerHTML='<div class="empty">該当するグループがありません。</div>';return}x={g,a:null}}
 const {g,a}=x;
 let h=`<div class="detail-top"><h2>${g.round}回戦 ${esc(g.group)}</h2></div><div class="meta">${g.submissions}回答 · ${g.voters}人投票 · 上位${g.advancementCount}位まで通過</div><div class="section-label">お題</div><div class="prompt">${promptHTML(g)}</div>`;
 if(a){
  const b=a.voteBreakdown||{};
  h+=`<div class="section-label">回答</div>${rankHTML(a)}<div class="answer">${fillHTML(g,a)}</div><div class="author">${a.isSelf?"自分":esc(a.author)} · 上位${(a.rank/g.submissions*100).toFixed(1)}％</div><div class="breakdown"><span class="point">4点 × ${b["4"]||0}</span><span class="point">3点 × ${b["3"]||0}</span><span class="point">2点 × ${b["2"]||0}</span></div>`;
 }else{
  const self=g.answers.find(a=>a.isSelf);
  if(self)h+=`<div class="section-label">自分の回答</div>${rankHTML(self)}<div class="answer">${fillHTML(g,self)}</div>`;
  h+=`<div class="section-label">通過回答</div><div class="group-list">${g.answers.filter(a=>a.passed).map(a=>`<button class="mini" data-mini="${a.position}"><div class="mini-top"><strong>${a.position}位</strong><span class="score">${a.totalScore}点｜${Number(a.voteRate).toFixed(2)}</span></div><div class="mini-answer">${fillHTML(g,a)}</div></button>`).join("")}</div>`;
 }
 h+=`<a class="source" href="${esc(g.source)}" target="_blank" rel="noopener">元の結果を見る ↗</a>`;
 $("detail").innerHTML=h;
 $("detail").querySelectorAll("[data-mini]").forEach(b=>b.onclick=()=>{selected={groupKey:g.round+"-"+g.id,position:+b.dataset.mini};renderHeat(visible());renderDetail()});
}
function render(){const list=visible();renderStats(list);renderHeat(list);renderDetail()}
fetch("hangiri7_1_2.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{DATA=d;bind();render()}).catch(e=>{$("detail").innerHTML='<div class="empty">データを読み込めませんでした。</div>';console.error(e)});
</script>
</body></html>
