name: Scrape Hangiri7
on:
  push:
    paths:
      - scrape_hangiri7.mjs
      - .github/workflows/scrape_hangiri7.yml
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install devalue
      - run: node scrape_hangiri7.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hangiri7_rounds_debug.json
          git commit -m "Debug Hangiri7 group fetches" || exit 0
          git push
