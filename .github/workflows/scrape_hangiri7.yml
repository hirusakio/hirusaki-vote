name: Scrape Hangiri7
on:
  push:
    paths:
      - scrape_hangiri7.py
      - .github/workflows/scrape_hangiri7.yml
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scrape_hangiri7.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hangiri7_discovery.json
          git commit -m "Discover Hangiri7 public data endpoints" || exit 0
          git push
