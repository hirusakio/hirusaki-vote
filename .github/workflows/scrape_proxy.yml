name: Scrape via proxy
on:
  push:
    paths:
      - scrape_proxy.py
      - .github/workflows/scrape_proxy.yml
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scrape_proxy.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_52_81_full.json
          git commit -m "Add full answer metrics audit" || exit 0
          git push
