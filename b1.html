(--muted);font-weight:650;margin:18px 0 8px}.theme-box{background:#f8fafc;border:1px solid #e6ebf3;border-radius:10px;padding:13px;font-size:16px;line-height:1.8;overflow-wrap:anywhere}.theme-image{display:block;width:100%;max-height:220px;object-fit:contain;margin:8px 0;border-radius:6px}.rank-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}.rank{font-weight:800;font-size:19px}.score{font-size:14px;color:var(--muted)}.badge{padding:3px 7px;font-size:13px;border-radius:5px;color:#17283f;font-weight:700}.badge.p3{color:#fff}.badge.p2{color:#fff}.actual{font-size:13px;color:var(--muted);margin:3px 0 8px}.answer-text{font-size:17px;line-height:1.85;overflow-wrap:anywhere;white-space:pre-wrap;margin:8px 0}.author{font-size:13px;color:var(--muted);margin-top:9px}.vote-list{display:flex;flex-direction:column;gap:10px}.vote-card{border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;padding:12px;width:100%;display:block}.vote-card:hover{background:#f8fafc}.vote-card .rank{font-size:16px}.vote-card .answer-text{font-size:16px}.source{font-size:14px;display:inline-block;margin-top:20px}.back{font-size:14px;border:0;background:none;color:#245aa5;padding:0;text-decoration:underline;text-underline-offset:4px;margin:14px 0 0}.empty-state{padding:14px 0;color:var(--muted);font-size:14px}footer{font-size:12px;color:var(--muted);margin-top:16px}#error{color:#a32727}

<body>
  <main class="shell">
    <header class="header">
      <div><div class="eyebrow">地下1階</div><h1>投票ヒートマップ</h1><p id="range">結果を読み込んでいます…</p></div>
      <a href="https://oogiri-b1.com/" target="_blank" rel="noopener">地下1階を開く ↗</a>
    </header>
    <section class="card controls" aria-label="絞り込み">
      <div class="filter-line">
        <span class="filter-label">公開月</span><div id="months" class="button-group"></div>
        <label class="filter-label" for="date">公開日</label><select id="date"><option value="">すべて</option></select>
        <span class="filter-label">投票</span><div id="points" class="button-group"></div>
        <button id="reset" class="reset">リセット</button>
      </div>
      <div class="stats" aria-live="polite">
        <div><span>対象投票</span><strong id="vote-count">—</strong></div>
        <div><span>上位25％への投票</span><strong id="top25">—</strong></div>
        <div><span>上位50％への投票</span><strong id="top50">—</strong></div>
      </div>
    </section>
    <div class="main-grid">
      <section class="card heat-card" aria-label="順位別の投票先">
        <div class="heat-title"><h2>投票先</h2><span id="theme-count"></span></div>
        <div class="legend">
          <span><i class="p4"></i>4点</span><span><i class="p3"></i>3点</span><span><i class="p2"></i>2点</span><span><i class="self"></i>自分の回答</span><span><i class="empty"></i>投票なし</span><span><i class="void"></i>順位なし</span>
        </div>
        <p class="help">マスを選ぶと回答、日付を選ぶと投票先一覧を表示します。</p>
        <div class="heat-scroll"><div id="heat" class="heat"></div></div>
        <p class="footnote">横軸は順位。同率は元サイトの掲載順に並べ、集計には実順位 ÷ 回答数を使用します。</p>
        <p id="error" role="alert" hidden></p>
      </section>
      <aside id="detail" class="card detail" aria-label="お題と回答" aria-live="polite"></aside>
    </div>
    <footer id="verified"></footer>
  </main>
<script>'use strict';
let data, themes=[], selectedId, selectedPosition=null;
let selectedMonths=new Set(), selectedPoints=new Set([4,3,2]);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortDate=s=>s.slice(5).replace('-','/');
const allMonths=()=>[...new Set(themes.map(t=>t.date.slice(0,7)))];
const visible=()=>themes.filter(t=>selectedMonths.has(t.date.slice(0,7))&&(!$('date').value||t.date===$('date').value));
const pointMatches=a=>a.vote>0&&selectedPoints.has(a.vote);
function toggle(set,value,all){
  if(set.size===all.length){set.clear();set.add(value)}
  else if(set.has(value)){if(set.size===1)all.forEach(v=>set.add(v));else set.delete(value)}
  else set.add(value);
}
function answerHTML(t,a){
  let text=a.answer.replace(/ /g,'');
  const theme=t.theme.replace(/ /g,'');
  const match=theme.match(/[○〇◯＿_]{2,}|[□]{2,}/);
  if(match){
    const pre=theme.slice(0,match.index), post=theme.slice(match.index+match[0].length);
    if(text.startsWith(pre)&&text.endsWith(post)&&text.length>=pre.length+post.length){
      const end=post.length?text.length-post.length:text.length;
      return esc(pre)+'<strong>'+esc(text.slice(pre.length,end))+'</strong>'+esc(post);
    }
    return '<strong>'+esc(text)+'</strong>';
  }
  return esc(text);
}
function renderFilters(){
  $('months').innerHTML=allMonths().map(m=>`<button class="toggle ${selectedMonths.has(m)?'active':''}" data-month="${m}" aria-pressed="${selectedMonths.has(m)}">${Number(m.slice(5))}月</button>`).join('');
  $('points').innerHTML=[4,3,2].map(p=>`<button class="toggle ${selectedPoints.has(p)?'active':''}" data-point="${p}" aria-pressed="${selectedPoints.has(p)}">${p}点</button>`).join('');
}
function renderStats(list){
  const votes=list.flatMap(t=>t.answers.filter(pointMatches).map(a=>({a,t})));
  $('vote-count').textContent=votes.length+'件';
  for(const n of [25,50]){
    const count=votes.filter(({a,t})=>a.rank/t.count<=n/100).length;
    $('top'+n).innerHTML=(votes.length?(count/votes.length*100).toFixed(1)+'％':'—')+`<small>${count} / ${votes.length}件</small>`;
  }
  $('theme-count').textContent=list.length+'題';
}
function renderHeat(list){
  const cols=Math.max(...themes.map(t=>t.count));
  $('heat').style.setProperty('--cols',cols);
  let html='<div class="cell head">公開日</div>';
  for(let p=1;p<=cols;p++) html+=`<div class="cell head">${p===1||p%5===0?p:''}</div>`;
  for(const t of list){
    html+=`<button class="cell label ${t.id===selectedId&&selectedPosition===null?'selected':''}" data-theme="${t.id}" title="${esc(t.theme||'画像で一言')}" aria-label="${t.date}公開の投票先一覧">${shortDate(t.date)}</button>`;
    for(let p=1;p<=cols;p++){
      const a=t.answers[p-1];
      if(!a){html+='<div class="cell void" aria-hidden="true"></div>';continue;}
      const cls=a.self?'self':a.vote?'p'+a.vote:'empty';
      const label=`${t.date}公開 ${p}位${a.rank!==p?'（実順位'+a.rank+'位）':''} ${a.self?'自分の回答':a.author} ${a.vote?a.vote+'点を投票':'投票なし'}`;
      html+=`<button class="cell answer ${cls} ${a.vote&&!pointMatches(a)?'dim':''} ${t.id===selectedId&&p===selectedPosition?'selected':''}" data-theme="${t.id}" data-position="${p}" aria-label="${esc(label)}" title="${esc(label)}" aria-pressed="${t.id===selectedId&&p===selectedPosition}"></button>`;
    }
  }
  $('heat').innerHTML=html;
}
function rankHTML(a){
  return `<div class="rank-line"><span class="rank">${a.position}位</span><span class="score">${a.total}点</span>${a.vote?`<span class="badge p${a.vote}">${a.vote}点</span>`:''}${a.self?'<span class="badge self">自分の回答</span>':''}</div>${a.rank!==a.position?`<div class="actual">実順位 ${a.rank}位（同率）</div>`:''}`;
}
function renderDetail(){
  const t=themes.find(t=>t.id===selectedId);
  if(!t){$('detail').innerHTML='<p class="empty-state">該当する公開日がありません。</p>';return;}
  const a=selectedPosition?t.answers[selectedPosition-1]:null;
  const list=visible(), index=list.indexOf(t);
  const prev=a?a.position>1:index>0, next=a?a.position<t.count:index<list.length-1;
  let html=`<div class="detail-top"><h2>${shortDate(t.date)} 公開</h2><div class="navs"><button class="nav" data-nav="-1" aria-label="前の${a?'回答':'お題'}" ${prev?'':'disabled'}>‹</button><button class="nav" data-nav="1" aria-label="次の${a?'回答':'お題'}" ${next?'':'disabled'}>›</button></div></div><div class="meta">${t.count}回答 · ${t.voters}人が投票</div><div class="section-label">お題</div><div class="theme-box">${esc(t.theme).replace(/\n/g,'<br>')}${t.image?`<a href="${esc(t.image)}" target="_blank" rel="noopener" aria-label="お題画像を拡大"><img class="theme-image" src="${esc(t.image)}" alt="${shortDate(t.date)}公開のお題画像"></a>`:''}</div>`;
  if(a){
    html+=`<div class="section-label">回答</div>${rankHTML(a)}<div class="answer-text">${answerHTML(t,a)}</div><div class="author">${a.self?'自分':esc(a.author)} · 上位${(a.rank/t.count*100).toFixed(1)}％</div><button class="back" data-back>このお題の投票先一覧</button>`;
  }else{
    const votes=t.answers.filter(pointMatches);
    html+=`<div class="section-label">投票先 · ${votes.length}件 / ${votes.reduce((s,a)=>s+a.vote,0)}点</div><div class="vote-list">`;
    html+=votes.length?votes.map(a=>`<button class="vote-card" data-answer="${a.position}">${rankHTML(a)}<div class="answer-text">${answerHTML(t,a)}</div><div class="author">${a.self?'自分':esc(a.author)}</div></button>`).join(''):'<div class="empty-state">この条件の投票はありません。</div>';
    html+='</div>';
  }
  html+=`<a class="source" href="${t.source}" target="_blank" rel="noopener">元の結果を見る ↗</a>`;
  $('detail').innerHTML=html;
}
function render(){
  const list=visible();
  if(!list.some(t=>t.id===selectedId)){selectedId=list.at(-1)?.id;selectedPosition=null;}
  renderFilters();renderStats(list);renderHeat(list);renderDetail();
}
function choose(id,position,scroll=false){
  selectedId=id;selectedPosition=position;renderHeat(visible());renderDetail();
  if(scroll&&matchMedia('(max-width:1099px)').matches)$('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
$('months').addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(!b)return;toggle(selectedMonths,b.dataset.month,allMonths());$('date').value='';render()});
$('points').addEventListener('click',e=>{const b=e.target.closest('[data-point]');if(!b)return;toggle(selectedPoints,Number(b.dataset.point),[4,3,2]);render()});
$('date').addEventListener('change',()=>{if($('date').value)selectedMonths=new Set(allMonths());render()});
$('reset').addEventListener('click',()=>{selectedMonths=new Set(allMonths());selectedPoints=new Set([4,3,2]);$('date').value='';render()});
$('heat').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(b)choose(b.dataset.theme,b.dataset.position?Number(b.dataset.position):null,true)});
$('heat').addEventListener('keydown',e=>{
  if(!e.target.matches('.answer')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();const rows=visible();let row=rows.findIndex(t=>t.id===e.target.dataset.theme);let pos=Number(e.target.dataset.position);
  if(e.key==='ArrowLeft')pos--;if(e.key==='ArrowRight')pos++;if(e.key==='ArrowUp')row--;if(e.key==='ArrowDown')row++;
  if(row<0||row>=rows.length)return;pos=Math.max(1,Math.min(rows[row].count,pos));
  $('heat').querySelector(`[data-theme="${rows[row].id}"][data-position="${pos}"]`)?.focus();
});
$('detail').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-back'))choose(selectedId,null);
  else if(b.dataset.answer)choose(selectedId,Number(b.dataset.answer));
  else if(b.dataset.nav){
    const d=Number(b.dataset.nav);if(selectedPosition)choose(selectedId,selectedPosition+d);
    else{const list=visible();const i=list.findIndex(t=>t.id===selectedId);if(list[i+d])choose(list[i+d].id,null)}
  }
